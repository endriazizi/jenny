name: Jenny review page quality gate
on:
  push:
    branches: [main]
    paths:
      - 'src/pages/recensione.astro'
      - 'src/scripts/booking-client.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/jenny-review-check.yml'
  pull_request:
    paths:
      - 'src/pages/recensione.astro'
      - 'src/scripts/booking-client.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/jenny-review-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
